# Pure Black Minimalist Theme

shell zsh

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window Layout & Padding
window_padding_width 14
confirm_os_window_close 0

# Glassmorphism Translucency
background_opacity 0.72
dynamic_background_opacity yes

# Colors (Pitch Black OLED Theme)
background            #0a0a0f
foreground            #e6e8ec
selection_background  #ffffff
selection_foreground  #000000

# Cursor
cursor                #ffffff
cursor_text_color     #000000
cursor_shape          block
cursor_blink_interval 0

# URL underline
url_color             #ffffff
url_style             curly

# Tab Bar - Floating Rounded Tabs
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_align           left
tab_bar_show_new_tab_button yes
tab_bar_margin_width    8.0
tab_bar_margin_height   6.0 2.0
tab_title_template      " {title} "
active_tab_title_template " {title} "

# Tab Colors (Pure Black)
tab_bar_background      #000000
active_tab_foreground   #ffffff
active_tab_background   #1a1a1e
active_tab_font_style   bold
inactive_tab_foreground #666a74
inactive_tab_background #0a0a0c
inactive_tab_font_style normal

# Border
active_border_color   #ffffff
inactive_border_color #1e1e22

# ANSI Colors (Pure Black OLED)
color0 #000000
color8 #73798a
color1 #e06c75
color9 #ea7c85
color2 #98c379
color10 #a8d389
color3 #e5c07b
color11 #f0cb86
color4 #7289a0
color12 #8ba0b7
color5 #c678dd
color13 #d189e8
color6 #56b6c2
color14 #66c6d2
color7 #d2d5da
color15 #ffffff
