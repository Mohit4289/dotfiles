# Graphite Theme matching screenshot

shell zsh

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window layout & padding
window_padding_width 14
confirm_os_window_close 0

# Colors (Graphite Dark)
background            #202226
foreground            #d2d5da
selection_background  #ffffff
selection_foreground  #1c1e22

# Cursor
cursor                #d2d5da
cursor_text_color     #202226
cursor_shape          block
cursor_blink_interval 0

# URL underline
url_color             #ffffff
url_style             curly

# Tab Bar - Graphite Floating Rounded Tabs
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_align           left
tab_bar_show_new_tab_button yes
tab_bar_margin_width    8.0
tab_bar_margin_height   6.0 2.0
tab_title_template      " {title} "
active_tab_title_template " {title} "

# Tab Colors
tab_bar_background      #202226
active_tab_foreground   #ffffff
active_tab_background   #2c2f35
active_tab_font_style   bold
inactive_tab_foreground #777b83
inactive_tab_background #18191c

# Border
active_border_color   #ffffff
inactive_border_color #303339

# ANSI Colors (Graphite)
color0 #202226
color8 #383b42
color1 #e06c75
color9 #ea7c85
color2 #98c379
color10 #a8d389
color3 #e5c07b
color11 #f0cb86
color4 #7289a0
color12 #8ba0b7
color5 #c678dd
color13 #d189e8
color6 #56b6c2
color14 #66c6d2
color7 #d2d5da
color15 #ffffff
