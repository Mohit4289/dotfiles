# Pure Black Modern App Launcher (Fuzzel)

[main]
font=Inter:size=11
prompt="  "
placeholder="Search apps..."
icon-theme=Adwaita-Slate
terminal=kitty

# Layout & Sizing
width=42
lines=8
line-height=28
horizontal-pad=24
vertical-pad=18
inner-pad=12

# Window Placement & Appearance
anchor=center
layer=overlay
match-mode=fzf
show-actions=yes

[colors]
background=0c0d10b8
text=e6e8ecff
prompt=ffffffff
placeholder=606470ff
input=ffffffff

# Match Highlighting
match=ffffffff

# Selected Item (Crisp White Card with Black Text)
selection=ffffffff
selection-text=000000ff
selection-match=000000ff

# Border
border=ffffff25

[border]
width=1
radius=18
selection-radius=10
