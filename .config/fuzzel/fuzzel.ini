# Graphite Modern App Launcher (Fuzzel)

[main]
font=Inter:size=11
prompt="  "
placeholder="Search apps..."
icon-theme=Adwaita-Slate
icons=yes
terminal=kitty

# Layout & Sizing
width=42
lines=8
line-height=28
horizontal-pad=24
vertical-pad=18
inner-pad=12

# Window Placement & Appearance
anchor=center
layer=overlay
match-mode=fzf
show-actions=yes

[colors]
background=202226f8
text=d2d5daff
prompt=ffffffff
placeholder=6b7078ff
input=ffffffff

# Match Highlighting
match=ffffffff

# Selected Item (White Card with Dark Text matching Graphite)
selection=ffffffff
selection-text=1c1e22ff
selection-match=1c1e22ff

# Border
border=363940ff

[border]
width=1
radius=18
selection-radius=10
